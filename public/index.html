<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>בלוט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d17;--panel:#151a2b;--panel2:#1d2440;--gold:#d9b25f;--gold2:#f3dc9a;--txt:#f5ecd5;--dim:#9aa0b8;--wine:#7a1f3d;--ok:#46c28a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,-apple-system,"Segoe UI",sans-serif}
.scr{position:fixed;inset:0;height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;padding-top:max(22px,env(safe-area-inset-top));padding-bottom:max(22px,env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% 0%,#1d2440 0%,#0b0d17 60%);text-align:center}
.scr.on{display:flex}
.logo{font-size:84px;font-weight:900;line-height:1;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#9c7a2e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px #d9b25f55)}
.tag{color:var(--dim);font-size:17px;margin-top:-6px}
input{width:100%;max-width:320px;padding:15px;font-size:18px;font-family:inherit;border-radius:16px;border:1px solid #2c3558;background:var(--panel);color:var(--txt);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--gold)}
button{font-family:inherit;font-size:18px;font-weight:700;padding:15px 22px;border:0;border-radius:16px;color:#1a1305;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 6px 20px #d9b25f33;width:100%;max-width:320px}
button:active{transform:scale(.98)}button:disabled{opacity:.35}
a.lnk{color:var(--dim);font-size:15px;text-decoration:underline;padding:6px}
#err,#lerr{color:#ff9aa8;min-height:20px;font-size:15px}
.code{font-size:50px;font-weight:900;letter-spacing:10px;color:var(--gold2);direction:ltr}
.av{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px}
.pc{background:var(--panel);border:1px solid #2c3558;border-radius:18px;padding:10px 4px;font-size:14px}
.pc b{display:block;font-size:34px}.pc.empty{opacity:.35;border-style:dashed}
#game{justify-content:flex-start;gap:0;padding:0;background:var(--bg)}
#top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));font-size:15px}
#timer{font-weight:900;font-size:22px;color:var(--gold2);min-width:44px;text-align:center;direction:ltr}
#cat{background:var(--panel2);padding:3px 10px;border-radius:12px;color:var(--gold2);font-size:13px}
#board{width:100%;max-height:30%;background:linear-gradient(180deg,#121830,#0e1224);border-block:1px solid #2c3558}
#log{flex:1;width:100%;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;background:var(--panel);font-size:16px;line-height:1.35;word-break:break-word;align-self:flex-start}
.msg.clue{background:linear-gradient(180deg,#3a2f12,#2a2210);border:1px solid #6d5a25;color:var(--gold2)}
.msg.sys{align-self:center;background:none;color:var(--dim);font-size:13px;padding:2px}
.msg.ok{background:#173b2c;border:1px solid var(--ok);color:#b9f1d6}
.msg b{opacity:.85;font-weight:700}
#role{width:100%;padding:8px 14px;background:var(--panel2);text-align:center;font-size:16px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:10px}
#word{font-size:26px;font-weight:900;color:var(--gold2)}
#role a{font-size:13px}
#send{width:100%;display:flex;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--panel)}
#send input{max-width:none;flex:1;text-align:right}#send button{width:auto;padding:12px 20px;font-size:16px}
#rev{position:fixed;top:30%;left:50%;transform:translate(-50%,-20px);background:#000d;border:1px solid var(--gold);border-radius:20px;padding:16px 22px;text-align:center;font-size:18px;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:86%}
#rev.on{opacity:1;transform:translate(-50%,0)}#rev b{display:block;font-size:30px;color:var(--gold2)}
#blk{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--wine);padding:8px 16px;border-radius:14px;font-size:15px;opacity:0;transition:.2s;z-index:9;pointer-events:none}#blk.on{opacity:1}
#end{z-index:20}#fx{position:absolute;inset:0;pointer-events:none}
#end h1{margin:0;font-size:36px;color:var(--gold2)}#end .big{font-size:96px}
.tk{transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
</style></head><body>
<div id="home" class="scr on">
 <div class="logo">בלוט</div><div class="tag">משחק מילים למסיבות ✨</div>
 <input id="nm" maxlength="12" placeholder="איך קוראים לך?" autocomplete="off">
 <input id="cd" maxlength="4" placeholder="קוד החדר" autocapitalize="characters" autocomplete="off" style="display:none;direction:ltr">
 <button id="go">משחק חדש</button>
 <a class="lnk" id="alt">יש לי קוד להצטרפות</a><div id="err"></div>
</div>
<div id="lobby" class="scr">
 <div class="tag">קוד החדר</div><div class="code" id="lc">----</div>
 <div class="av" id="av"></div>
 <button id="wa">שליחת הזמנה בוואטסאפ</button>
 <button id="st">מתחילים!</button><div id="lerr" style="color:var(--dim)"></div>
 <a class="lnk" id="cp">העתקת קישור</a><a class="lnk" id="lv">יציאה</a>
</div>
<div id="game" class="scr">
 <div id="top"><span id="who"></span><span id="timer">60</span><span id="cat"></span></div>
 <svg id="board" viewBox="0 0 320 190" preserveAspectRatio="xMidYMid meet"></svg>
 <div id="log"></div>
 <div id="role"></div>
 <form id="send"><input id="txt" maxlength="100" placeholder="כתבי כאן..." autocomplete="off"><button>שליחה</button></form>
</div>
<div id="rev"></div><div id="blk"></div>
<div id="end" class="scr"><canvas id="fx"></canvas><div class="big">🎁</div><h1 id="et"></h1><div id="es" style="font-size:20px;color:var(--dim)"></div>
 <button id="again">משחק חוזר</button><a class="lnk" id="lv2">יציאה</a></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
let pid;try{pid=sessionStorage.pid||(sessionStorage.pid=Math.random().toString(36).slice(2)+Date.now())}catch(e){pid=Math.random().toString(36).slice(2)}
const sock=io();let you=-1,roomCode='',R=null,word='',canSkip=false,mode='create';
const show=id=>document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
const q=new URLSearchParams(location.search).get('room');
try{$('nm').value=localStorage.nm||''}catch(e){}
function setMode(m){mode=m;$('cd').style.display=m==='join'?'':'none';$('go').textContent=m==='join'?'הצטרפות':'משחק חדש';$('alt').textContent=m==='join'?'לפתוח משחק חדש':'יש לי קוד להצטרפות'}
if(q){$('cd').value=q.toUpperCase();setMode('join');$('alt').style.display='none'}
$('alt').onclick=()=>setMode(mode==='join'?'create':'join');
$('go').onclick=()=>{const n=$('nm').value.trim();if(!n){$('err').textContent='איך קוראים לך?';return}try{localStorage.nm=n}catch(e){}$('err').textContent='';
 mode==='join'?sock.emit('join',{code:$('cd').value,name:n,pid}):sock.emit('create',{name:n,pid})};
const link=()=>location.origin+'/?room='+roomCode;
$('wa').onclick=()=>{const t='בואו לשחק בלוט! 🎁✨ '+link();navigator.share?navigator.share({text:t}).catch(()=>{}):open('https://wa.me/?text='+encodeURIComponent(t))};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(link());$('cp').textContent='הועתק ✓'}catch(e){prompt('העתיקי את הקישור',link())}};
$('st').onclick=()=>sock.emit('start');$('again').onclick=()=>sock.emit('start');
$('lv').onclick=$('lv2').onclick=()=>sock.emit('leave');
sock.on('err',m=>{$('err').textContent=m});
sock.on('joined',d=>{you=d.you;roomCode=d.code;history.replaceState(null,'','/?room='+d.code);if(!$('game').classList.contains('on')&&!$('end').classList.contains('on'))show('lobby')});
sock.on('left',m=>{roomCode='';show('home');history.replaceState(null,'','/');$('err').textContent=typeof m==='string'?m:''});
sock.on('connect',()=>{if(roomCode)sock.emit('join',{code:roomCode,name:$('nm').value||'שחקנית',pid})});
// ---- state ----
sock.on('room',r=>{R=r;
 $('lc').textContent=r.code;
 $('av').innerHTML=Array.from({length:6},(_,i)=>{const p=r.players[i];return p?`<div class="pc"><b>${p.emoji}</b>${esc(p.name)}${i===you?' (את/ה)':''}${p.connected?'':' 📴'}</div>`:'<div class="pc empty"><b>＋</b>פנוי</div>'}).join('');
 const host=you===0;$('st').style.display=host?'':'none';$('st').disabled=r.players.filter(p=>p.connected).length<2;
 $('lerr').textContent=host?(r.players.length<2?'ממתינים לשחקנים נוספים…':''):'ממתינים שהמארחת תתחיל…';
 if(r.phase==='lobby'&&($('game').classList.contains('on')))show('lobby');
 if(r.phase!=='lobby')render()});
sock.on('start',()=>{$('log').innerHTML='';word='';$('end').querySelector('#fx').getContext('2d').clearRect(0,0,9999,9999);show('game');board()});
sock.on('word',d=>{word=d.word;canSkip=!d.skip;render()});
sock.on('tick',t=>{$('timer').textContent=t});
sock.on('chat',m=>addChat(m));
sock.on('blocked',m=>{const b=$('blk');b.textContent=m;b.classList.add('on');setTimeout(()=>b.classList.remove('on'),1800)});
sock.on('reveal',d=>{const r=$('rev');const w=d.winner>=0?R.players[d.winner]:null;
 r.innerHTML=`המילה הייתה<b>${esc(d.word)}</b>`+(w?`${w.emoji} ${esc(w.name)} ניחש/ה! ${d.fast?'⚡ מהר! +2 צעדים':'+1 צעד'}<br>${R.players[d.d].emoji} ${esc(R.players[d.d].name)}: +1 צעד`:'⏰ נגמר הזמן — אף אחד לא ניחש');
 r.classList.add('on');word='';render();setTimeout(()=>r.classList.remove('on'),3200)});
sock.on('end',d=>{show('end');$('et').textContent=`${d.name} הגיע/ה למתנה! 🎉`;$('es').textContent='מזל טוב רות! 🎂✨';$('again').style.display=you===0?'':'none';party()});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addChat(m){const d=document.createElement('div');d.className='msg '+m.k+(m.ok?' ok':'');
 if(m.k==='sys')d.textContent=m.text;else{const p=R&&R.players[m.from],b=document.createElement('b'),s=document.createElement('span');b.textContent=(p?p.emoji+' '+p.name:'')+': ';s.textContent=m.text;d.append(b,s)}
 $('log').append(d);$('log').scrollTop=1e9}
function render(){if(!R||!R.round)return;const rd=R.round,d=R.players[rd.d];
 $('who').textContent=`${d.emoji} ${d.name} מתאר/ת`;$('cat').textContent=rd.cat;$('timer').textContent=rd.t;
 const mine=you===rd.d;
 $('role').innerHTML=rd.over?'<span style="color:var(--dim)">הסיבוב הבא מתחיל…</span>':mine?`<span>המילה שלך:</span><span id="word">${esc(word)}</span>${canSkip?'<a class="lnk" id="sk">החלפה</a>':''}`:`<span style="letter-spacing:3px;color:var(--gold2)">${rd.len.map(n=>'▢'.repeat(n)).join('  ')}</span>`;
 if($('sk'))$('sk').onclick=()=>{sock.emit('skip');canSkip=false};
 $('txt').placeholder=mine?'תארי במילים (בלי להגיד את המילה)…':'נחשי את המילה…';board()}
$('send').onsubmit=e=>{e.preventDefault();const t=$('txt').value.trim();if(t)sock.emit('say',{text:t});$('txt').value='';$('txt').focus()};
// ---- board ----
const CELL=i=>{const r=i>>2,c=r%2?3-(i&3):i&3;return[40+c*80,30+r*43]};
let tokens=[];
function board(){if(!R)return;const sv=$('board');
 if(!sv.dataset.built){let p='M'+CELL(0).join(' ');for(let i=1;i<16;i++)p+=' L'+CELL(i).join(' ');
  let h=`<path d="${p}" fill="none" stroke="#d9b25f" stroke-opacity=".35" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="${p}" fill="none" stroke="#0b0d17" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
  for(let i=0;i<15;i++){const[x,y]=CELL(i);h+=`<circle cx="${x}" cy="${y}" r="${i%5===0?9:6}" fill="${i%5===0?'#d9b25f':'#2c3558'}"/>`}
  const[gx,gy]=CELL(15);h+=`<circle cx="${gx}" cy="${gy}" r="22" fill="#d9b25f" opacity=".25"/><text x="${gx}" y="${gy+10}" font-size="30" text-anchor="middle">🎁</text>`;
  sv.innerHTML=h+'<g id="tks"></g>';sv.dataset.built=1}
 const g=$('tks');while(tokens.length<R.players.length){const n=tokens.length,el=document.createElementNS('http://www.w3.org/2000/svg','g');el.setAttribute('class','tk');el.innerHTML=`<circle r="12" fill="#151a2b" stroke="#f3dc9a" stroke-width="2"/><text y="6" font-size="15" text-anchor="middle">${R.players[n].emoji}</text>`;g.append(el);tokens.push(el)}
 const stack={};R.players.forEach((p,i)=>{const c=Math.min(15,Math.round(Math.min(p.pos,R.target)/R.target*15));const k=stack[c]=(stack[c]||0)+1;const[x,y]=CELL(c);tokens[i].style.transform=`translate(${x+((k-1)%3-1)*10}px,${y+Math.floor((k-1)/3)*12-2}px)`})}
// ---- confetti (gold) ----
function party(){const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cl=['#f3dc9a','#d9b25f','#fff','#7a1f3d','#46c28a'];
 const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,c:cl[Math.random()*5|0],e:Math.random()<.12?'🎈':null}));
 (function loop(){if(!$('end').classList.contains('on'))return;x.clearRect(0,0,c.width,c.height);for(const p of ps){p.y+=p.v;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}if(p.e){x.font='26px serif';x.fillText(p.e,p.x,p.y)}else{x.fillStyle=p.c;x.fillRect(p.x,p.y,6,10)}}requestAnimationFrame(loop)})()}
document.addEventListener('gesturestart',e=>e.preventDefault());
</script></body></html>
